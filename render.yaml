# Render Blueprint specification for 1-Click Cloud Deployment
# Free tier web service with native WebSocket & HTTP support

services:
  - type: web
    name: casino-multiplayer
    env: node
    plan: free
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: ENABLE_TUNNEL
        value: "false"
